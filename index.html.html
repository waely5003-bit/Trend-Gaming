<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trend Gaming Center - المرج</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            direction: rtl;
            text-align: right;
        }

        body {
            background: linear-gradient(135deg, #0d0221 0%, #190933 35%, #2c0c4d 70%, #4a0e4e 100%);
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -20%;
            left: -20%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(0, 243, 255, 0.15) 0%, rgba(131, 56, 236, 0.05) 50%, transparent 70%);
            z-index: -1;
            filter: blur(80px);
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -20%;
            right: -20%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(255, 0, 128, 0.15) 0%, rgba(131, 56, 236, 0.05) 50%, transparent 70%);
            z-index: -1;
            filter: blur(80px);
        }

        header {
            background: rgba(13, 2, 33, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area h1 {
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(45deg, #00f3ff, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }

        nav {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        nav a {
            color: #b8c1ec;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: 0.3s;
        }

        nav a:hover {
            color: #00f3ff;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.8);
        }

        .cta-nav {
            background: linear-gradient(45deg, #00f3ff, #7000ff);
            color: #fff !important;
            padding: 8px 20px;
            border-radius: 30px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        @media(max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .hero-card {
            background: rgba(25, 12, 51, 0.75);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(131, 56, 236, 0.4);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 243, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .hero-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, #00f3ff, #ff007f, #7000ff);
        }

        .badge {
            display: inline-block;
            background: rgba(0, 243, 255, 0.1);
            color: #00f3ff;
            border: 1px solid rgba(0, 243, 255, 0.3);
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        h2 {
            font-size: 2.3rem;
            font-weight: 900;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #ffffff, #00f3ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #b8c1ec;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        @media(max-width: 600px) {
            .features-grid {
                grid-template-columns: 1fr;
            }
        }

        .feature-box {
            background: rgba(13, 2, 33, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            transition: 0.3s;
        }

        .feature-box:hover {
            border-color: #00f3ff;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3
